name: 六策略盘后预选与模拟记账
on:
  schedule:
    - cron: '50 8 * * MON-FRI'
    - cron: '30 9 * * MON-FRI'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/scan.yml', 'daily.py', 'scripts/postclose_guard.py', '.github/top-watchdog.json']
permissions:
  contents: write
concurrency:
  group: top-daily-main
  cancel-in-progress: false
jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read latest main after waiting for concurrent scans
        run: git pull --ff-only origin main
      - name: Check current post-close report and ledger
        id: guard
        run: echo "needed=$(python scripts/postclose_guard.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.needed == 'true'
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        if: steps.guard.outputs.needed == 'true'
        with:
          path: stock_pool/data/prices
          key: tdx-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tdx-
      - run: pip install -r stock_pool/reconstructed/requirements.txt
        if: steps.guard.outputs.needed == 'true'
      - name: 核验扫描规则
        if: steps.guard.outputs.needed == 'true'
        run: |
          python -m unittest test_postclose_guard
          python -m unittest discover -s stock_pool/reconstructed
      - name: 扫描及记账
        if: steps.guard.outputs.needed == 'true'
        run: python daily.py --retry-missing
      - name: 保存日报与台账
        if: steps.guard.outputs.needed == 'true'
        run: |
          git add reports
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update daily candidates and paper ledger"
          for attempt in 1 2 3; do
            git pull --rebase
            if git push; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 10))"; fi
          done
          exit 1
      - name: 保留未能发布的日报和台账
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-reports
          path: reports/
          if-no-files-found: ignore
