name: 六策略盘后预选与模拟记账
on:
  schedule:
    - cron: '0 9 * * 1-5'
    - cron: '30 9 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/scan.yml', 'daily.py']
permissions:
  contents: write
concurrency:
  group: top-daily-main
  cancel-in-progress: false
jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: stock_pool/data/prices
          key: tdx-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tdx-
      - run: pip install -r stock_pool/reconstructed/requirements.txt
      - name: 核验扫描规则
        run: python -m unittest discover -s stock_pool/reconstructed
      - name: 扫描及记账
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = '30 9 * * 1-5' ]; then
            python daily.py --retry-missing
          else
            python daily.py
          fi
      - name: 保存日报与台账
        run: |
          git add reports
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update daily candidates and paper ledger"
          for attempt in 1 2 3; do
            git pull --rebase
            if git push; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 10))"; fi
          done
          exit 1
      - name: 保留未能发布的日报和台账
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-reports
          path: reports/
          if-no-files-found: ignore
